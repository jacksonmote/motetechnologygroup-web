name: Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the run still in progress.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.22.1

jobs:
  html:
    name: HTML
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # .github/htmlvalidate.json extends html-validate:recommended. JSON allows
      # no comments, so the rules turned off there are explained here:
      # - doctype-style: wants <!DOCTYPE html> in uppercase. The lowercase
      #   <!doctype html> the pages use is equally valid HTML; style only.
      - name: Validate HTML
        run: npx --yes html-validate@11.17.0 --config .github/htmlvalidate.json $(git ls-files '*.html')
      # Cache-busting: every page must link the stylesheet as /styles.css?v=N
      # with the same N everywhere. On pull requests, if styles.css differs from
      # the base branch, N must be higher than the base branch's N, so returning
      # visitors get the new CSS instead of a cached copy. (N may never go down.)
      # The base branch is fetched read-only; no credentials are needed.
      - name: Stylesheet version
        if: success() || failure()
        run: |
          if [ -n "$GITHUB_BASE_REF" ]; then
            git fetch --quiet --depth=1 origin "$GITHUB_BASE_REF"
          fi
          python3 - <<'PY'
          import os, re, subprocess, sys

          PAGES = ["index.html", "404.html", "home/index.html", "business/index.html", "faq/index.html"]
          LINK = re.compile(r'<link\b[^>]*\bhref="([^"]*styles\.css[^"]*)"')
          VERSIONED = re.compile(r"/styles\.css\?v=(\d+)")

          def versions(read):
              found, errors = {}, []
              for page in PAGES:
                  hrefs = LINK.findall(read(page))
                  if len(hrefs) != 1:
                      errors.append(f"{page}: expected one styles.css link, found {len(hrefs)}")
                      continue
                  m = VERSIONED.fullmatch(hrefs[0])
                  if not m:
                      errors.append(f'{page}: links "{hrefs[0]}", expected "/styles.css?v=N"')
                      continue
                  found[page] = int(m.group(1))
              return found, errors

          found, errors = versions(lambda p: open(p, encoding="utf-8").read())
          if len(set(found.values())) > 1:
              errors.append("pages use different versions: " + ", ".join(f"{p} v={n}" for p, n in found.items()))
          if errors:
              sys.exit("\n".join(errors))
          version = next(iter(found.values()))
          print(f"All {len(PAGES)} pages link /styles.css?v={version}")

          if os.environ.get("GITHUB_BASE_REF"):
              def show(path):
                  r = subprocess.run(["git", "show", f"FETCH_HEAD:{path}"], capture_output=True, text=True)
                  return r.stdout if r.returncode == 0 else ""
              base = max(versions(show)[0].values(), default=0)
              css_changed = subprocess.run(["git", "diff", "--quiet", "FETCH_HEAD", "--", "styles.css"]).returncode != 0
              print(f"Base branch: v={base}; styles.css changed: {'yes' if css_changed else 'no'}")
              if version < base:
                  sys.exit(f"Version went down from v={base} to v={version}")
              if css_changed and version <= base:
                  sys.exit(f"styles.css changed but the version is still v={version}. Bump ?v= to {base + 1} on all {len(PAGES)} pages.")
          PY
      # Web app manifest: site.webmanifest is valid JSON with the expected
      # fields, its description matches the home page's meta description, every
      # page links it, and every icon exists as a PNG whose real size (read from
      # the IHDR header) matches its "sizes" entry.
      - name: Manifest
        if: success() || failure()
        run: |
          python3 - <<'PY'
          import html, json, os, re, struct, sys

          PAGES = ["index.html", "404.html", "home/index.html", "business/index.html", "faq/index.html"]
          EXPECTED = {
              "name": "Mote Technology Group", "short_name": "Mote Tech", "id": "/", "start_url": "/",
              "scope": "/", "display": "browser", "lang": "en",
              "background_color": "#F7F4F0", "theme_color": "#0C1526",
          }
          errors = []
          try:
              manifest = json.load(open("site.webmanifest", encoding="utf-8"))
          except (OSError, ValueError) as e:
              sys.exit(f"site.webmanifest: {e}")

          for key, value in EXPECTED.items():
              if manifest.get(key) != value:
                  errors.append(f'"{key}" is {manifest.get(key)!r}, expected {value!r}')
          home = re.search(r'<meta name="description" content="([^"]*)">', open("index.html", encoding="utf-8").read())
          if not manifest.get("description") or not home or manifest["description"] != html.unescape(home.group(1)):
              errors.append('"description" must match the home page meta description')
          for page in PAGES:
              if '<link rel="manifest" href="/site.webmanifest">' not in open(page, encoding="utf-8").read():
                  errors.append(f"{page}: missing <link rel=\"manifest\" href=\"/site.webmanifest\">")

          icons = manifest.get("icons") or []
          if not icons:
              errors.append('"icons" is missing or empty')
          for icon in icons:
              src, sizes = icon.get("src", ""), icon.get("sizes", "")
              if icon.get("type") != "image/png" or icon.get("purpose") not in ("any", "maskable"):
                  errors.append(f"{src or icon}: needs \"type\": \"image/png\" and a \"purpose\" of any or maskable")
              path = src.lstrip("/")
              if not src.startswith("/") or not os.path.isfile(path):
                  errors.append(f"{src}: file not found")
                  continue
              head = open(path, "rb").read(24)
              if head[:8] != b"\x89PNG\r\n\x1a\n" or head[12:16] != b"IHDR":
                  errors.append(f"{src}: not a PNG")
                  continue
              width, height = struct.unpack(">II", head[16:24])
              if sizes != f"{width}x{height}":
                  errors.append(f'{src}: "sizes" is "{sizes}" but the image is {width}x{height}')

          if errors:
              sys.exit("\n".join(errors))
          print(f"site.webmanifest OK: {len(icons)} icons, linked from all {len(PAGES)} pages")
          PY

  links:
    name: Links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Offline: internal pages, assets and #fragments, resolved against the
      # repo root. /faq/ style links resolve to the folder's index.html.
      - name: Check internal links and anchors
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: >-
            --offline --include-fragments --index-files index.html
            --root-dir ${{ github.workspace }} --no-progress
            './**/*.html'
      # Online, http(s) only, so mailto: links are skipped. Sites like LinkedIn
      # often block bots (LinkedIn answers 999), so a failure here only warns.
      - name: Check external links (warning only)
        id: external
        continue-on-error: true
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: >-
            --scheme https --scheme http
            --root-dir ${{ github.workspace }} --no-progress --max-retries 2
            './**/*.html'
      - name: Warn about external link failures
        if: steps.external.outcome == 'failure'
        run: echo "::warning title=External links::Some external links failed. Sites like LinkedIn often block bots; see the previous step's log."

  accessibility:
    name: Accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Start local server
        run: |
          python3 -m http.server 8000 > /dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/ > /dev/null && exit 0; sleep 0.5; done
          echo "Server did not start"; exit 1
      # .github/pa11y.json: axe runner at WCAG 2.1 AA (pa11y's WCAG2AA maps to
      # axe's wcag2a, wcag21a, wcag2aa, wcag21aa and best-practice tags), each
      # page at 1280px and 390px. Chrome args:
      # - --no-sandbox: Ubuntu runners block Chrome's sandbox.
      # - --force-prefers-reduced-motion: the scroll fade-ins start at opacity 0,
      #   so without it axe measures text mid-fade and reports false contrast
      #   failures. Reduced motion shows every element in its final state.
      # - --blink-settings=preferredColorScheme=1: light mode, so results don't
      #   depend on the machine's theme.
      # hideElements excludes only the decorative aria-hidden "→" in the
      # "Learn more" links: axe can't measure a lone arrow ("nonBmp", needs
      # review) and pa11y counts that as an error. The arrow uses the link
      # color, and the link text next to it is still checked.
      - name: Run pa11y-ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          export PUPPETEER_EXECUTABLE_PATH="$(command -v google-chrome)"
          npx --yes pa11y-ci@5.0.0 --config .github/pa11y.json
      # .github/pa11y-dark.json is the same config with
      # --blink-settings=preferredColorScheme=0 (dark mode). It keeps
      # --force-prefers-reduced-motion for the same reason as above. The
      # first run's failure must not skip this one, hence the condition.
      - name: Run pa11y-ci (dark mode)
        if: success() || failure()
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          export PUPPETEER_EXECUTABLE_PATH="$(command -v google-chrome)"
          npx --yes pa11y-ci@5.0.0 --config .github/pa11y-dark.json

  requests:
    name: No outside requests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Start local server
        run: |
          python3 -m http.server 8000 > /dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/ > /dev/null && exit 0; sleep 0.5; done
          echo "Server did not start"; exit 1
      # Installed next to the script (not committed) so its import resolves.
      # The script uses the runner's Google Chrome, so no browser download.
      - name: Install Playwright
        run: npm install --no-save --no-package-lock --no-audit --no-fund --prefix .github/scripts playwright@1.64.1
      - name: Load every page and check requests and console
        run: node .github/scripts/no-external-requests.mjs http://localhost:8000/
